<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174b36">
  <title>红梅</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main><article aria-labelledby="plant-name">
    <header>
      <h1 id="plant-name">红梅</h1>
      <p class="latin" lang="la">Prunus mume</p>
      <dl class="taxonomy"><div><dt>科</dt><dd>蔷薇科</dd></div><div><dt>属</dt><dd>李属</dd></div></dl>
    </header>
    <dl><div class="detail"><dt>形态特征</dt><dd>落叶乔木，花期2-3月，6-7月果实成熟</dd></div><div class="detail"><dt>生长习性</dt><dd>喜温暖气候，有一定的耐寒力，花期对气候变化非常敏感，梅喜欢空气湿度较大，但花期时忌暴雨。对土壤要求不严，比较耐瘠薄。亦能在轻碱性土中正常生长。阳性树种，喜阳光充足，通风良好。为长寿树种。</dd></div><div class="detail"><dt>地理分布</dt><dd>中国是梅的原产地。梅的栽培分布区域远较自然分布区域大，除自然分布梅的栽培之外，在北京、山东、河南以及西藏自治区首府拉萨梅有梅的栽培。此外，我国海南省也有梅的栽培。</dd></div></dl>
  </article></main>
</body>
</html>
