<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174b36">
  <title>朴树</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main><article aria-labelledby="plant-name">
    <header>
      <h1 id="plant-name">朴树</h1>
      <p class="latin" lang="la">Celtis sinensis Pers.</p>
      <dl class="taxonomy"><div><dt>科</dt><dd>大麻科</dd></div><div><dt>属</dt><dd>朴属</dd></div></dl>
    </header>
    <dl><div class="detail"><dt>形态特征</dt><dd>落叶乔木，花期4-5月，果期9-10月</dd></div><div class="detail"><dt>生长习性</dt><dd>适应力较强、喜光、稍耐阴、耐寒、对土壤要求不严、耐轻度盐碱，以土层深厚、肥沃的黏质土壤为最佳。</dd></div><div class="detail"><dt>地理分布</dt><dd>原产于中国，现分布于中国的淮河流域、秦岭以南至华南各省区、长江中下游和以南诸省以及台湾地区，在越南、老挝也有所分布。</dd></div></dl>
  </article></main>
</body>
</html>
