      <h1 id="plant-name">红枫</h1>
      <p class="latin" lang="la">Acer palmatum &#x27;Atropurpureum&#x27; (Van Houtte) Schwer</p>
      <dl class="taxonomy"><div><dt>科</dt><dd>槭树科</dd></div><div><dt>属</dt><dd>槭属</dd></div></dl>

    <dl><div class="detail"><dt>形态特征</dt><dd>落叶小乔木，秋色叶树种，花期4-5月，果熟期10月。</dd></div><div class="detail"><dt>生长习性</dt><dd>性喜阳光，适合温暖湿润气候，怕烈日暴晒，较耐寒，稍耐旱，不耐涝，适生于肥沃疏松排水良好的土壤。</dd></div><div class="detail"><dt>地理分布</dt><dd>原产于中国江苏、江西、湖北等地。</dd></div></dl>
