<head>

  <title>罗汉松</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main><article aria-labelledby="plant-name">
    <header>
      <h1 id="plant-name">罗汉松</h1>
      <p class="latin" lang="la">Podocarpus macrophyllus (Thunb.) Sweet</p>
      <dl class="taxonomy"><div><dt>科</dt><dd>罗汉松科</dd></div><div><dt>属</dt><dd>罗汉松属</dd></div></dl>
    </header>
    <dl><div class="detail"><dt>形态特征</dt><dd>常绿乔木，花期4-5月，种子8-9月成熟。</dd></div><div class="detail"><dt>生长习性</dt><dd>喜温暖湿润气候，耐寒性弱，耐阴性强。喜排水良好湿润之砂质壤土，对土壤适应性强，盐碱土上亦能生存。</dd></div><div class="detail"><dt>地理分布</dt><dd>产于中国江苏、浙江、福建、安徽、江西、湖南、四川、云南、贵州、广西、广东等省区，日本也有分布。</dd></div></dl>
  </article></main>
