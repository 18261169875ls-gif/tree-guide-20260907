  <title>榉树</title>

<body>
  <main><article aria-labelledby="plant-name">
    <header>
      <h1 id="plant-name">榉树</h1>
      <p class="latin" lang="la">Zelkova serrata (Thunb.) Makino</p>
      <dl class="taxonomy"><div><dt>科</dt><dd>榆科</dd></div><div><dt>属</dt><dd>榉属</dd></div></dl>
    </header>
    <dl><div class="detail"><dt>形态特征</dt><dd>落叶乔木，花期4月，果期10月。</dd></div><div class="detail"><dt>生长习性</dt><dd>性喜光，喜温暖气候和肥沃湿润土壤，在微酸性、中性、石灰质土及轻盐碱土上均能生长。</dd></div><div class="detail"><dt>地理分布</dt><dd>为中国特有种，主要分布于中国淮河流域、秦岭以南的长江中下游各地，南至广东、广西，西至贵州及云南东南部，国际上主要分布于在日本和朝鲜。</dd></div></dl>
  </article></main>
