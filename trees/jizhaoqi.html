<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>鸡爪槭</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main><article aria-labelledby="plant-name">
    <header>
      <h1 id="plant-name">鸡爪槭</h1>
      <p class="latin" lang="la">Acer palmatum Thunb. in Murray</p>
      <dl class="taxonomy"><div><dt>科</dt><dd>槭树科</dd></div><div><dt>属</dt><dd>槭属</dd></div></dl>
    </header>
    <dl><div class="detail"><dt>形态特征</dt><dd>落叶小乔木，秋色叶树种，花期5月，果期9～10月。</dd></div><div class="detail"><dt>生长习性</dt><dd>弱阳性树种，耐半阴，喜温暖湿润的气候和肥沃、湿润而排水良好的土壤，耐寒性不强，酸性、中性及石灰质土均能适应。</dd></div><div class="detail"><dt>地理分布</dt><dd>产自中国山东、河南南部、江苏、浙江、安徽、江西、湖北、湖南、贵州等省，生于海拔较低的林边或疏林中，朝鲜和日本也有分布。</dd></div></dl>
  </article></main>
</body>
</html>
