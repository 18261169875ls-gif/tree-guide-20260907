  <title>香樟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main><article aria-labelledby="plant-name">
    <header>
      <h1 id="plant-name">香樟</h1>
      <p class="latin" lang="la">Cinnamomum camphora (Linn) Presl</p>
      <dl class="taxonomy"><div><dt>科</dt><dd>樟科</dd></div><div><dt>属</dt><dd>樟属</dd></div></dl>
    </header>
    <dl><div class="detail"><dt>形态特征</dt><dd>常绿大乔木，花期4-5月，果期8-11月。</dd></div><div class="detail"><dt>生长习性</dt><dd>喜光，稍耐阴；喜温暖湿润气候，耐寒性不强。适生于深厚肥沃的酸性或中性砂壤土，根系发达，深根性，抗倒能力强。</dd></div><div class="detail"><dt>地理分布</dt><dd>产中国南方及西南各省区。越南、朝鲜、日本也有分布，其他各国常有引种栽培。</dd></div></dl>
  </article></main>
