<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174b36">
  <title>丛生香橼</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main><article aria-labelledby="plant-name">
    <header>
      <h1 id="plant-name">丛生香橼</h1>
      <p class="latin" lang="la">Citrus medica L.</p>
      <dl class="taxonomy"><div><dt>科</dt><dd>芸香科</dd></div><div><dt>属</dt><dd>柑橘属</dd></div></dl>
    </header>
    <dl><div class="detail"><dt>形态特征</dt><dd>常绿灌木或小乔木，花期4-5月，果期10-11月。</dd></div><div class="detail"><dt>生长习性</dt><dd>喜高温多湿环境，怕严霜，不耐严寒，以土层深厚、疏松肥沃、富含腐殖质、排水良好的砂质壤上栽培为宜。</dd></div><div class="detail"><dt>地理分布</dt><dd>原产于亚洲，特别是亚热带和暖温带地区。</dd></div></dl>
  </article></main>
</body>
</html>
