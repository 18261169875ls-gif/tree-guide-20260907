  <title>染井吉野樱</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main><article aria-labelledby="plant-name">
    <header>
      <h1 id="plant-name">染井吉野樱</h1>
      <p class="latin" lang="la">Prunus yedoensis Matsum.</p>
      <dl class="taxonomy"><div><dt>科</dt><dd>蔷薇科</dd></div><div><dt>属</dt><dd>李属</dd></div></dl>
    </header>
    <dl><div class="detail"><dt>形态特征</dt><dd>落叶乔木，花期4月，果期5月。</dd></div><div class="detail"><dt>生长习性</dt><dd>喜光、喜温、喜湿、喜肥，冬季极端最低温度不低于-20℃的地方都能生长良好，正常结果。适宜在土层深厚、土质疏松、透气性好、保水力较强的砂壤土或砾质壤土上栽培，对盐渍化的程度反应很敏感。</dd></div><div class="detail"><dt>地理分布</dt><dd>原产日本。世界北纬与日本同纬度的地区及中国北京、西安、青岛、南京、南昌等城市庭园多有栽培。园艺品种很多，供观赏用。</dd></div></dl>
  </article></main>
</body>
</html>
