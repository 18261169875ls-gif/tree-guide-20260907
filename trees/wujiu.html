<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174b36">
  <title>乌桕</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main><article aria-labelledby="plant-name">
    <header>
      <h1 id="plant-name">乌桕</h1>
      <p class="latin" lang="la">Triadica sebifera (Linnaeus) Small</p>
      <dl class="taxonomy"><div><dt>科</dt><dd>大戟科</dd></div><div><dt>属</dt><dd>乌桕属</dd></div></dl>
    </header>
    <dl><div class="detail"><dt>形态特征</dt><dd>落叶乔木，秋色叶树种，花期4-8月。</dd></div><div class="detail"><dt>生长习性</dt><dd>阳性植物，性喜高温、湿润、向阳之地，生长适宜温度为20到30摄氏度，主根发达，抗风力强，生长快速，耐热也耐寒、耐旱、耐瘠。</dd></div><div class="detail"><dt>地理分布</dt><dd>原产于中国大陆，清代时期由闽、浙随着移民引入台湾，是中国特有的经济树种，分布于中国黄河以南各省区，日本、越南、印度、欧美、非洲也有。</dd></div></dl>
  </article></main>
</body>
</html>
